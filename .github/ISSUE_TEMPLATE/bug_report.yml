name: 버그 신고
description: 게임에서 만든 보고서를 붙여 넣거나 항목별로 작성해 주세요.
title: "[버그] "
body:
  - type: markdown
    attributes:
      value: |
        비공식·비영리 팬 프로젝트의 버그 신고입니다. 먼저 기존 이슈를 검색해 주세요.
        개인정보, 토큰, 민감한 저장 JSON은 공개 이슈에 올리지 마세요.
        게임의 설정 → 버그 신고에서 생성한 Markdown 전체를 아래 칸에 붙여 넣을 수 있습니다.
  - type: textarea
    id: body
    attributes:
      label: 버그 보고서
      description: 실제 동작·기대 동작·재현 단계와 앱 버전을 적어 주세요. 빈 항목은 채운 뒤 제출해 주세요.
      value: |
        ## 요약

        ## 발생 위치와 빈도
        위치: 타이틀 / 선택 / 지도 / 이벤트 / 전투 / 진화 / 결과 / 도감 / 설정 / 저장·불러오기 / 오디오 / 기타
        빈도: 한 번 / 가끔 / 항상
        심각도: 불편 / 진행 방해 / 진행 불가 / 저장 손실 의심

        ## 실제 동작

        ## 기대 동작

        ## 재현 단계
        1.
        2.

        ## 진단 정보
        앱 버전:
        브라우저·기기 (선택):

        ## 추가 설명
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 전 확인
      options:
        - label: 개인정보·토큰·민감한 저장 내용이 없는지 직접 확인했습니다.
          required: true
