name: Build and deploy Pages

# Pushes validate the game. Publishing additionally requires the owner to
# enable Pages and explicitly set the repository variable PAGES_ENABLED=true.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Run game tests
        run: npm test
      - name: Build static game
        run: npm run build
      - name: Check Pages paths and sharing constraints
        run: npm run check:pages
      - name: Configure existing Pages site
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v5
      - name: Upload successful build only
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
