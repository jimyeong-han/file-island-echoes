<!doctype html><html lang="ko"><meta charset="utf-8"><title>Local PWA diagnostics</title><h1>Local PWA diagnostics (disposable origin only)</h1><a href="/file-island-echoes/">Game</a><button id="music">Verify cached music</button><button id="read">Inspect PWA</button><button id="missing">Load unvisited illustration in frame</button><button id="zoom">320px / 200% text frame</button><iframe id="game" title="200% game" style="display:none;width:320px;height:740px"></iframe><pre id="result"></pre><script>
missing.onclick=()=>{const doc=game.contentDocument;doc.getElementById('qa-missing')?.remove();const img=doc.createElement('img');img.id='qa-missing';img.alt='Unvisited illustration';img.src='/file-island-echoes/assets/characters/devimon-battle.webp';doc.getElementById('app').append(img);};
zoom.onclick=()=>{game.style.display='block';game.onload=()=>{game.contentDocument.documentElement.style.fontSize='32px';};game.src='/file-island-echoes/';};
music.onclick=async()=>{const names=(await caches.keys()).filter(n=>n.startsWith('file-island-echoes-music-'));const ctx=new AudioContext();const checks=[];for(const name of names){const cache=await caches.open(name);for(const key of await cache.keys()){try{const r=await cache.match(key);const bytes=await r.arrayBuffer();const buffer=await ctx.decodeAudioData(bytes);checks.push({file:new URL(key.url).pathname,ok:buffer.duration>0,duration:buffer.duration});}catch(e){checks.push({file:key.url,ok:false,error:String(e)});}}}await ctx.close();result.textContent=JSON.stringify({music:checks,count:checks.length,passed:checks.every(c=>c.ok)},null,2);};
read.onclick=async()=>{const regs=await navigator.serviceWorker.getRegistrations();const names=await caches.keys();const details=[];for(const name of names){const cache=await caches.open(name);const keys=await cache.keys();let bytes=0;for(const key of keys)bytes+=(await (await cache.match(key)).blob()).size;details.push({name,count:keys.length,bytes,urls:keys.map(k=>new URL(k.url).pathname)});}result.textContent=JSON.stringify({registrations:regs.map(r=>({scope:r.scope,active:r.active?.state,waiting:r.waiting?.state,script:r.active?.scriptURL})),caches:details,estimate:await navigator.storage.estimate()},null,2);};
</script></html>
