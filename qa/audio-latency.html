<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio latency QA</title><style>body{background:#112334;color:white;font:18px system-ui}button{padding:20px;margin:8px}pre{white-space:pre-wrap}</style><h1>Audio latency QA</h1><p id="mode"></p><button id="first">First activation + confirm</button><button id="cold">Select cue</button><button id="warm">Confirm cue</button><button id="hide">Suspend / resume</button><pre id="out"></pre><script type="module">
const baseline=new URLSearchParams(location.search).has('baseline');
const {AudioManager}=await import(baseline?'../test-results/audio-baseline.ts':'../src/audio.ts');
const rows=[],out=document.querySelector('#out');let input=0;const buffers=new WeakMap();
function log(row){rows.push(row);out.textContent=JSON.stringify(rows,null,2)}
const realFetch=window.fetch;window.fetch=async(...args)=>{const t=performance.now();await new Promise(r=>setTimeout(r,200));const response=await realFetch(...args);const read=response.arrayBuffer.bind(response);response.arrayBuffer=async()=>{const a=await read();buffers.set(a,String(args[0]).split('/').at(-1));return a};log({fetch:String(args[0]).split('/').at(-1),ms:performance.now()-t});return response};
const Real=window.AudioContext;window.AudioContext=class extends Real{constructor(...args){super(...args);log({baseLatency:this.baseLatency,outputLatency:this.outputLatency,options:args})}async decodeAudioData(a){const t=performance.now(),b=await super.decodeAudioData(a);buffers.set(b,buffers.get(a));log({decode:buffers.get(a),ms:performance.now()-t});return b}createBufferSource(){const s=super.createBufferSource(),start=s.start.bind(s);s.start=(at=0,offset=0)=>{log({start:buffers.get(s.buffer),inputMs:performance.now()-input,scheduledMs:1000*(at-this.currentTime)});start(at,offset)};return s}};
const mixer=new AudioManager({muted:false,masterVolume:.8,musicVolume:.65,sfxVolume:.8,guide:true,reducedMotion:false});
document.querySelector('#mode').textContent=(baseline?'v0.5 baseline':'v0.5.1 candidate')+' · controlled 200ms delay per fetch · no music';
for(const name of ['pointerdown','pointerup','click','keydown'])document.addEventListener(name,e=>{if(e.target.tagName!=='BUTTON')return;input=performance.now();log({event:name,t:input});},true);
document.querySelector('#first').onclick=()=>{if(baseline){void mixer.unlock();void mixer.play('ui-confirm')}else{void mixer.playInput('ui-confirm')}};
document.querySelector('#cold').onclick=()=>void mixer.play('ui-select');document.querySelector('#warm').onclick=()=>void mixer.play('ui-confirm');document.querySelector('#hide').onclick=async()=>{await mixer.visibility(true);await mixer.visibility(false);log({status:mixer.status})};
const options=document.createElement('button');options.textContent='Compare interactive hint';document.body.append(options);options.onclick=async()=>{const c=new Real({latencyHint:'interactive'});await c.resume();log({interactiveBase:c.baseLatency,interactiveOutput:c.outputLatency});await c.close()};
</script></html>
